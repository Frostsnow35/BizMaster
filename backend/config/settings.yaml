analysis:
  max_retry_count: 3
  max_steps: 10
app:
  debug: false
  name: 掌柜 BizMaster
  version: 0.1.0
chromadb:
  persist_path: data/chroma
database:
  sqlite_path: data/agent.db
deepseek:
  api_key: ""  # 启动后通过设置页面填写，将加密存储；也可通过环境变量 DEEPSEEK_API_KEY 设置
  base_url: https://api.deepseek.com/v1
llm:
  default_model: deepseek-chat
  max_tokens: 4096
  provider: deepseek
  temperature: 0.1
  timeout: 60
server:
  host: 127.0.0.1
  port: 8000
upload:
  allowed_extensions:
  - .csv
  - .xlsx
  - .xls
  max_file_size_mb: 100
